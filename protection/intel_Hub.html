<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intel Hub</title>
  <style>
    :root {
      --bg: #0a0d12;
      --panel-bg: #111622;
      --border: #1e293b;
      --accent: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.2);
      --text: #e2e8f0;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      color: var(--accent);
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .badge {
      background: var(--accent);
      color: #000;
      padding: 4px 8px;
      font-weight: bold;
      border-radius: 3px;
      font-size: 0.8rem;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      height: fit-content;
    }

    .panel h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 15px;
      text-transform: uppercase;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 5px;
    }

    .form-group { margin-bottom: 12px; }

    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }

    input, textarea {
      width: 100%;
      padding: 10px;
      background: #07090e;
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 4px;
      outline: none;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    input:focus, textarea:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      transition: 0.2s;
    }

    button:hover { opacity: 0.9; box-shadow: 0 0 10px var(--accent-glow); }

    .search-bar { margin-bottom: 20px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    /* Fixed Height Card Setup */
    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 15px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      height: 320px; /* Fixed Height for layout uniformity */
    }

    .card-title {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* Text Truncation Logic */
    .card-body {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.4;
      flex-grow: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 8; /* Truncates long text block */
      -webkit-box-orient: vertical;
      word-break: break-word;
      margin-bottom: 12px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.7rem;
      padding: 8px 4px;
    }

    .action-btn:hover {
      background: var(--accent);
      color: #000;
    }

    /* Full Document Reader View */
    .reader-view {
      display: none;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 25px;
      min-height: 70vh;
    }

    .reader-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 15px;
    }

    .reader-title {
      font-size: 1.5rem;
      color: var(--accent);
    }

    .back-btn {
      width: auto;
      padding: 8px 16px;
      font-size: 0.8rem;
    }

    .reader-content {
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Intel Hub</h1>
    <div><span class="badge">DATABASE ACTIVE</span></div>
  </header>

  <!-- HOME VIEW -->
  <div class="container" id="mainLayout">
    <!-- INPUT PANEL -->
    <div class="panel">
      <h2>Add Intel Entry</h2>
      <form id="intelForm">
        <div class="form-group">
          <label>NAME</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>DOCUMENT TEXT</label>
          <textarea id="documentText" placeholder="Enter biography or detailed dossier..." required></textarea>
        </div>
        <button type="submit">Inject Record</button>
      </form>
      <div id="status" class="status">Status: Standby</div>
    </div>

    <!-- MAIN DATABASE GRID -->
    <div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="⚡ Search database by Name or Content...">
      </div>
      <div class="grid" id="cardGrid"></div>
    </div>
  </div>

  <!-- FULL DOCUMENT READER VIEW -->
  <div class="reader-view" id="readerView">
    <div class="reader-header">
      <div class="reader-title" id="readerTitle">Document Details</div>
      <button class="back-btn" onclick="closeReader()">← Back to Home</button>
    </div>
    <div class="reader-content" id="readerContent"></div>
  </div>

  <script>
    const records = [];

    // Load files listed in storage.txt
    async function loadStorage() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Status: Reading storage.txt...';
      try {
        const res = await fetch('storage.txt');
        if (!res.ok) throw new Error('storage.txt not found');
        const text = await res.text();
        
        const fileList = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        for (const filePath of fileList) {
          try {
            const fileRes = await fetch(filePath);
            if (fileRes.ok) {
              const fileContent = await fileRes.text();
              parseAndAddRecord(fileContent);
            }
          } catch (e) {
            console.warn(`Could not load file: ${filePath}`);
          }
        }
        statusEl.textContent = `Status: Loaded ${records.length} records.`;
      } catch (err) {
        statusEl.textContent = 'Status: Manual mode (No storage.txt found)';
      }
    }

    // Parse the simplified text file structure
    function parseAndAddRecord(rawText) {
      const match = rawText.match(/^Name:\s*(.*)\r?\n([\s\S]*)/i);
      if (match) {
        const name = match[1].trim() || 'Untitled Record';
        const docText = match[2].trim() || rawText.trim();
        records.push({ name, docText });
      } else {
        records.push({ name: 'Unformatted Record', docText: rawText.trim() });
      }
      renderGrid();
    }

    // Render Database Grid
    function renderGrid(filter = '') {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      const filtered = records.filter(r => 
        r.name.toLowerCase().includes(filter.toLowerCase()) || 
        r.docText.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach((item) => {
        // Find absolute index in master records list
        const masterIndex = records.indexOf(item);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">${escapeHTML(item.name)}</div>
          <div class="card-body">${escapeHTML(item.docText)}</div>
          <div class="card-actions">
            <button class="action-btn" onclick="copyDocument(${masterIndex})">📋 Copy Full</button>
            <button class="action-btn" onclick="openReader(${masterIndex})">👁 See Full</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // HTML escape utility to avoid raw injection breakages
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Full Document Copy Action
    function copyDocument(index) {
      const item = records[index];
      const textToCopy = `Name: ${item.name}\n\n${item.docText}`;
      navigator.clipboard.writeText(textToCopy);
      alert(`Full document copied for: ${item.name}`);
    }

    // Open Full Document Page View
    function openReader(index) {
      const item = records[index];
      document.getElementById('readerTitle').textContent = item.name;
      document.getElementById('readerContent').textContent = item.docText;
      document.getElementById('mainLayout').style.display = 'none';
      document.getElementById('readerView').style.display = 'block';
      window.scrollTo(0, 0);
    }

    // Return to Homepage
    function closeReader() {
      document.getElementById('readerView').style.display = 'none';
      document.getElementById('mainLayout').style.display = 'grid';
    }

    // Add record via local form
    document.getElementById('intelForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const docText = document.getElementById('documentText').value;

      records.unshift({ name, docText });
      renderGrid();
      e.target.reset();
    });

    // Search filter listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderGrid(e.target.value);
    });

    // Initialize application
    loadStorage();
  </script>
</body>
</html>
