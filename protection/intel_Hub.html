<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intel Hub</title>
  <style>
    :root {
      --bg: #0a0d12;
      --panel-bg: #111622;
      --border: #1e293b;
      --accent: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.2);
      --text: #e2e8f0;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      color: var(--accent);
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .badge {
      background: var(--accent);
      color: #000;
      padding: 4px 8px;
      font-weight: bold;
      border-radius: 3px;
      font-size: 0.8rem;
    }

    .search-bar { margin-bottom: 20px; }

    input {
      width: 100%;
      padding: 12px;
      background: #07090e;
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 4px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    /* Fixed equal height cards */
    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 15px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 250px;
    }

    .card-title {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-body {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.4;
      flex-grow: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      transition: 0.2s;
    }

    button:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 15px;
    }

    /* Full document view */
    #fullDocView {
      display: none;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 25px;
      max-width: 900px;
      margin: 0 auto;
    }

    .back-btn {
      width: auto;
      padding: 8px 16px;
      margin-bottom: 20px;
    }

    .doc-content {
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <h1>Intel Hub</h1>
    <div><span class="badge">DATABASE ACTIVE</span></div>
  </header>

  <div id="status" class="status">Status: Standby</div>

  <!-- HOME VIEW -->
  <div id="homeView">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="⚡ Search database by Name or Document Content...">
    </div>
    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- FULL DOCUMENT VIEW -->
  <div id="fullDocView">
    <button class="back-btn" onclick="showHome()">← Back to Homepage</button>
    <div id="fullDocContent" class="doc-content"></div>
  </div>

  <script>
    const records = [];

    // Load file structure strictly from storage.txt
    async function loadStorage() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Status: Reading storage.txt...';
      try {
        const res = await fetch('storage.txt');
        if (!res.ok) throw new Error('storage.txt not found');
        const text = await res.text();
        
        const fileList = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        for (const filePath of fileList) {
          try {
            const fileRes = await fetch(filePath);
            if (fileRes.ok) {
              const fileContent = await fileRes.text();
              parseAndAddRecord(fileContent);
            }
          } catch (e) {
            console.warn(`Could not load file: ${filePath}`);
          }
        }
        statusEl.textContent = `Status: Loaded ${records.length} records from storage.txt.`;
      } catch (err) {
        statusEl.textContent = 'Status: Error - storage.txt not found.';
      }
    }

    // Parses raw file text matching Name: ... and body content
    function parseAndAddRecord(rawText) {
      const nameMatch = rawText.match(/^Name:\s*(.+)/im);
      const name = nameMatch ? nameMatch[1].trim() : 'Unknown';
      
      // Get body text after "Name: ..."
      let body = rawText;
      if (nameMatch) {
        body = rawText.replace(nameMatch[0], '').trim();
      }

      records.push({
        name: name,
        fullText: rawText,
        body: body
      });

      renderGrid();
    }

    // Render cards on home grid
    function renderGrid(filter = '') {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      const filtered = records.filter(r => 
        r.name.toLowerCase().includes(filter.toLowerCase()) ||
        r.body.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-title">Name: ${item.name}</div>
            <div class="card-body">${escapeHtml(item.body)}...</div>
          </div>
          <div class="card-actions">
            <button onclick="copyDoc(${index})">📋 Copy</button>
            <button onclick="seeDoc(${index})">👁 See Full</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Copy full raw file text
    function copyDoc(index) {
      navigator.clipboard.writeText(records[index].fullText);
      alert(`Copied full document for: ${records[index].name}`);
    }

    // Show full document page
    function seeDoc(index) {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('fullDocView').style.display = 'block';
      document.getElementById('fullDocContent').textContent = records[index].fullText;
      window.scrollTo(0, 0);
    }

    // Return to homepage
    function showHome() {
      document.getElementById('fullDocView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
    }

    // Search filter listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderGrid(e.target.value);
    });

    loadStorage();
  </script>
</body>
</html>
